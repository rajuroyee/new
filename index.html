<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Day Flip Book</title>

  <style>
    .gallery {
      --d: 10s;
      display: grid;
      place-items: center;
      width: 220px;
      margin-left: 220px;
    }

    .gallery > img {
      grid-area: 1/1;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border: 10px solid #f2f2f2;
      box-shadow: 0 0 4px #0007;
      z-index: 2;
      animation: slide var(--d) infinite, z-order var(--d) infinite steps(1);
    }

    .gallery img:last-child {
      animation-name: slide, z-order-last;
    }

    .gallery > img:nth-child(1) { animation-delay: calc(0*var(--d)); --r: 16deg; }
    .gallery > img:nth-child(2) { animation-delay: calc(-0.2*var(--d)); --r: -1deg; }
    .gallery > img:nth-child(3) { animation-delay: calc(-0.4*var(--d)); --r: -19deg; }
    .gallery > img:nth-child(4) { animation-delay: calc(-0.6*var(--d)); --r: 6deg; }
    .gallery > img:nth-child(5) { animation-delay: calc(-0.8*var(--d)); --r: -8deg; }

    @keyframes slide {
      10% { transform: translateX(120%) rotate(var(--r)); }
      0%, 20%, 100% { transform: translateX(0%) rotate(var(--r)); }
    }

    @keyframes z-order {
      10%, 20% { z-index: 1; }
      80% { z-index: 2; }
    }

    @keyframes z-order-last {
      10%, 20% { z-index: 1; }
      90% { z-index: 2; }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      background: #f8f6f1;
      overflow: hidden;
    }

    #hedlinecontainer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 60px;
    }

    #shine {
      font-size: 60px;
      font-weight: bold;
      color: rgba(255, 0, 102, 0.3);
      background: linear-gradient(90deg, #222, #fff, #222);
      background-size: 150px;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { background-position: -200px; }
      100% { background-position: 200px; }
    }

    @media (max-width: 600px) {
      #shine { font-size: 22px; }
      .gallery { width: 150px; margin-left: 60px; }
    }
  </style>
</head>

<body>
  <div id="hedlinecontainer">
    <div id="shine">Happy Valentine's Day 💞</div>
  </div>

  <div class="gallery">
    <img src="navigation/photo01.jpeg">
    <img src="photo02.jpeg">
    <img src="photo03.jpeg">
    <img src="photo04.jpeg">
    <img src="photo05.jpeg">
  </div>
     
</body>
</html>
